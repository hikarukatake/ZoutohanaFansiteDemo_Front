<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>企画作成 | 管理者</title>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0" />
    <link rel="stylesheet" href="../css/main.css">
    <link rel="stylesheet" href="../css/admin/admin.css">
</head>
<body id="admin-projectCreate">
    <header>管理者用ヘッダー</header>
    <main>
      <h1>企画作成</h1>
      <div class="admin-page-content">
        <form id="projectForm">
          <table>
            <tr>
              <th>企画名 : </th>
              <td><input type="text" name="name"></td>
            </tr>
            <tr>
              <th>企画URL<span class="material-symbols-outlined gray-text" title="企画ページのURLの末尾につく文字列です。">help</span> : </th>
              <td>
                <input type="text" name="urlKey" id="urlKey-input">
                <span class="gray-text">https://zoutohana-fansite.com/project/</span><span id="urlKey-preview" class="gray-text">_____</span>
              </td>
            </tr>
            <tr>
              <th>説明 : </th>
              <td><textarea rows="10" name="introduction"></textarea></td>
            </tr>
            <tr>
              <th>企画期間 : </th>
              <td>
                <input type="datetime-local" name="project-start-at">
                <span class="wave-dash">～</span>
                <input type="datetime-local" name="project-end-at">
              </td>
            </tr>
            <tr>
              <th>書評投稿期間 : </th>
              <td>
                <input type="datetime-local" name="submission-start-at">
                <span class="wave-dash">～</span>
                <input type="datetime-local" name="submission-end-at">
              </td>
            </tr>
            <tr>
              <th>書評投票期間 : </th>
              <td>
                <input type="datetime-local" name="voting-start-at">
                <span class="wave-dash">～</span>
                <input type="datetime-local" name="voting-end-at">
              </td>
            </tr>
            <tr>
              <th>書籍タイトル : </th>
              <td>
                <div class="radio-wrap">
                  <label><input type="radio" name="book-title" value="HIDE" checked="checked">表示しない</label>
                  <label><input type="radio" name="book-title" value="SHOW">表示する</label>
                </div>
              </td>
            </tr>
            <tr>
              <th>書評タイトル : </th>
              <td>
                <div class="radio-wrap">
                  <label><input type="radio" name="review-title" value="HIDE" checked="checked">表示しない</label>
                  <label><input type="radio" name="review-title" value="SHOW">表示する</label>
                </div>
              </td>
            </tr>
            <tr>
              <th>投稿者情報 : </th>
              <td>
                <div class="radio-wrap">
                  <label><input type="radio" name="user-info" value="HIDE" checked="checked">表示しない</label>
                  <label><input type="radio" name="user-info" value="SHOW">表示する</label>
                </div>
              </td>
            </tr>
            <tr>
              <th>テーマカラー : </th>
              <td>
                <div class="themeColor-wrap">
                  <label>
                    <input type="radio" name="theme-color" value="RED">
                    <span class="color-dot" style="background:var(--theme-red);">
                      <span class="material-symbols-outlined">check</span>
                    </span>
                  </label>

                  <label>
                    <input type="radio" name="theme-color" value="ORANGE">
                    <span class="color-dot" style="background:var(--theme-orange);">
                      <span class="material-symbols-outlined">check</span>
                    </span>
                  </label>

                  <label>
                    <input type="radio" name="theme-color" value="YELLOW">
                    <span class="color-dot" style="background:var(--theme-yellow);">
                      <span class="material-symbols-outlined">check</span>
                    </span>
                  </label>

                  <label>
                    <input type="radio" name="theme-color" value="LIME">
                    <span class="color-dot" style="background:var(--theme-lime);">
                      <span class="material-symbols-outlined">check</span>
                    </span>
                  </label>

                  <label>
                    <input type="radio" name="theme-color" value="GREEN">
                    <span class="color-dot" style="background:var(--theme-green);">
                      <span class="material-symbols-outlined">check</span>
                    </span>
                  </label>

                  <label>
                    <input type="radio" name="theme-color" value="TURQUOISE">
                    <span class="color-dot" style="background:var(--theme-turquoise);">
                      <span class="material-symbols-outlined">check</span>
                    </span>
                  </label>

                  <label>
                    <input type="radio" name="theme-color" value="LIGHTBLUE">
                    <span class="color-dot" style="background:var(--theme-lightblue);">
                      <span class="material-symbols-outlined">check</span>
                    </span>
                  </label>

                  <label>
                    <input type="radio" name="theme-color" value="BLUE">
                    <span class="color-dot" style="background:var(--theme-blue);">
                      <span class="material-symbols-outlined">check</span>
                    </span>
                  </label>

                  <label>
                    <input type="radio" name="theme-color" value="DARKBLUE">
                    <span class="color-dot" style="background:var(--theme-darkblue);">
                      <span class="material-symbols-outlined">check</span>
                    </span>
                  </label>

                  <label>
                    <input type="radio" name="theme-color" value="PURPLE">
                    <span class="color-dot" style="background:var(--theme-purple);">
                      <span class="material-symbols-outlined">check</span>
                    </span>
                  </label>

                  <label>
                    <input type="radio" name="theme-color" value="GRAY">
                    <span class="color-dot" style="background:var(--theme-gray);">
                      <span class="material-symbols-outlined">check</span>
                    </span>
                  </label>

                  <label>
                    <input type="radio" name="theme-color" value="ELEPHANT" checked="checked">
                    <span class="color-dot" style="background:var(--theme-elephant);">
                      <span class="material-symbols-outlined">check</span>
                    </span>
                  </label>
                </div>
              </td>
            </tr>
            <tr>
              <th>ロゴ画像 : </th>
              <td id="projectInput-td">
                <div>
                  <input type="file" accept="image/*" name="logo-img" id="logoImg-input">
                  <img id="logoImg-preview">
                </div>
              </td>
            </tr>
            <tr>
              <th>PDF : </th>
              <td id="projectInput-td">
                <div>
                  <input type="file" accept="application/pdf" name="pdf" multiple id="pdf-input">
                  <ul id="pdf-list-ul"></ul>
                </div>
              </td>
            </tr>
          </table>
          <div class="button-wrap">
            <button>キャンセル</button>
            <input type="submit" value="確認する">
          </div>
        </form>
      </div>
    </main>
    <footer></footer>
    <script src="../js/admin/admin.js"></script>
</body>
</html>
