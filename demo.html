<!DOCTYPE html>
<html lang="ja">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>9 Images XY-Offset Book Rain</title>
    <style>
        /* --- ベース設定 --- */
        body {
            margin: 0;
            overflow: hidden;
            background-color: #f0f2f5;
            font-family: sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }

        /* --- 本棚エリア --- */
        .shelf-grid {
            position: relative;
            width: 340px;
            height: 450px;
            /* 必要であれば背景の線などをここに追加 */
            z-index: 10;
        }

        /* --- 本のスタイル --- */
        .book {
            position: fixed;
            width: 110px;
            height: 140px;

            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            box-shadow: 5px 5px 15px rgba(0, 0, 0, 0.2);
            border-radius: 4px;

            user-select: none;
            z-index: 20;
            transition: transform 0.7s cubic-bezier(0.33, 1, 0.68, 1);
            transform: rotate(var(--initial-rotate, 0deg));
        }
    </style>
</head>

<body>

    <div class="shelf-grid" id="shelf"></div>

    <script>
        const shelf = document.getElementById('shelf');

        /* 1. 画像URLリスト (9枚) */
        const imageList = [
            '../',
            'https://placehold.co/110x140/e67e22/white?text=2',
            'https://placehold.co/110x140/f1c40f/white?text=3',
            'https://placehold.co/110x140/2ecc71/white?text=4',
            'https://placehold.co/110x140/1abc9c/white?text=5',
            'https://placehold.co/110x140/3498db/white?text=6',
            'https://placehold.co/110x140/9b59b6/white?text=7',
            'https://placehold.co/110x140/34495e/white?text=8',
            'https://placehold.co/110x140/95a5a6/white?text=9'
        ];

        /* 2. 回転角度 */
        const angles = [
            0, 0, 0, // 上段
            0, 0, 0, // 中段
            0, 0, 0  // 下段
        ];

        /* 3. ★各位置の「横のズレ」（ピクセル） */
        /* マイナス＝左へ、プラス＝右へズレる */
        const xOffsets = [
            -10, 0, 10,  // 上段: [1]左へ, [2]真ん中, [3]右へ
            -10, 0, 10,  // 中段: [4]右へ, [5]左へ, [6]真ん中
            -10, 0, 10  // 下段: [7]大きく左へ...など
        ];

        /* 4. ★各位置の「縦のズレ」（ピクセル） */
        /* マイナス＝上へ、プラス＝下へズレる */
        const yOffsets = [
            0, 50, 100,  // 上段
            50, 100, 150,  // 中段
            100, 150, 200   // 下段
        ];

        // 設定
        const MAX_BOOKS = 9;
        const COLS = 3;
        const CELL_WIDTH = 110;
        const CELL_HEIGHT = 140;

        let booksOnShelf = 0;

        function createBook() {
            const book = document.createElement('div');
            book.classList.add('book');

            // スタート位置
            const startX = Math.random() * (window.innerWidth - CELL_WIDTH);
            const startY = -250;
            const initialRotate = (Math.random() * 30) - 15;
            book.style.setProperty('--initial-rotate', initialRotate + 'deg');

            book.style.left = startX + 'px';
            book.style.top = startY + 'px';
            document.body.appendChild(book);

            // 配置処理
            if (booksOnShelf < MAX_BOOKS) {

                // 下から積む計算
                const gridRowFromBottom = Math.floor(booksOnShelf / COLS);
                const visualRow = (3 - 1) - gridRowFromBottom; // 上からの行番号(2,1,0)
                const visualCol = booksOnShelf % COLS;         // 左からの列番号

                // インデックス算出 (上から0~8)
                const index = (visualRow * 3) + visualCol;

                // 各種パラメータ取得
                book.style.backgroundImage = `url('${imageList[index]}')`;
                const targetAngle = angles[index];
                const heightOffset = yOffsets[index]; // 縦ズレ
                const widthOffset = xOffsets[index];  // ★横ズレ

                // 目標座標の計算
                const shelfRect = shelf.getBoundingClientRect();

                // ★横の位置 = 基準 + 横ズレ
                const targetX = shelfRect.left + (visualCol * CELL_WIDTH) + 10 + widthOffset;

                // ★縦の位置 = 基準 + 縦ズレ
                const targetY = shelfRect.top + (visualRow * CELL_HEIGHT) + heightOffset;

                booksOnShelf++;

                requestAnimationFrame(() => {
                    requestAnimationFrame(() => {
                        const moveX = targetX - startX;
                        const moveY = targetY - startY;
                        book.style.transform = `translate(${moveX}px, ${moveY}px) rotate(${targetAngle}deg)`;
                    });
                });

            } else {
                // 落下
                const randomImg = imageList[Math.floor(Math.random() * imageList.length)];
                book.style.backgroundImage = `url('${randomImg}')`;
                const duration = Math.random() * 2 + 1.5;
                book.style.animation = `fallThrough ${duration}s linear`;
                book.addEventListener('animationend', () => book.remove());
            }
        }

        setInterval(createBook, 500);

        document.body.addEventListener('click', () => {
            const books = document.querySelectorAll('.book');
            books.forEach(b => {
                if (!b.style.animationName) {
                    const currentTransform = getComputedStyle(b).transform;
                    b.style.transition = 'transform 0.6s ease-in, opacity 0.6s';
                    b.style.transform = `${currentTransform} translateY(600px) rotate(90deg)`;
                    b.style.opacity = '0';
                    setTimeout(() => b.remove(), 600);
                }
            });
            booksOnShelf = 0;
        });
    </script>
</body>

</html>
